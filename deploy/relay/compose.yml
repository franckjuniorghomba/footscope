services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?Configure RELAY_TOKEN}
      RELAY_BIND_ADDRESS: 0.0.0.0
      PORT: '8787'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  https:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
    read_only: true
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Configure RELAY_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  caddy_data:
  caddy_config:
